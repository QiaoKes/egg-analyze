name: Release Builds

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          APP_VERSION="${RAW_VERSION%%+*}"
          RELEASE_TAG="v${APP_VERSION}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-android.apk

  build-windows:
    name: Build Windows Installer
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ocr.txt

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle OCR Python runtime
        shell: pwsh
        run: |
          python ..\scripts\bundle_python_runtime.py `
            "$env:pythonLocation" `
            "build\windows\x64\runner\Release\python" `
            --requirements "..\requirements-ocr.txt" `
            --clear

      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.app_version }}"
          $tag = "${{ needs.prepare.outputs.release_tag }}"
          $output = (Resolve-Path ".").Path
          $appDir = Join-Path $output "build\windows\x64\runner\Release"
          $script = Join-Path $output "..\.github\installers\windows.iss"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DAppSourceDir=$appDir" `
            "/DOutputDir=$output" `
            "/DOutputBaseFilename=egg-analyze-v2-$tag-windows-setup" `
            $script

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-windows-setup.exe

  build-macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ocr.txt

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Bundle OCR Python runtime
        run: |
          python3 ../scripts/bundle_python_runtime.py \
            "$pythonLocation" \
            "build/macos/Build/Products/Release/egg_analyze_v2.app/Contents/Resources/python" \
            --requirements "../requirements-ocr.txt" \
            --clear

      - name: Create macOS DMG
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          APP_NAME="egg_analyze_v2.app"
          APP_DIR="build/macos/Build/Products/Release"
          STAGING="build/macos/dmg-staging"
          DMG_NAME="egg-analyze-v2-${TAG}-macos.dmg"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_DIR/$APP_NAME" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Egg Analyze V2" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: app/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-macos.dmg

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-android
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            dist/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-android.apk
            dist/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-windows-setup.exe
            dist/egg-analyze-v2-${{ needs.prepare.outputs.release_tag }}-macos.dmg
          generate_release_notes: true
