name: egg_analyze_v2
description: Flutter v2 app for egg analyze.
publish_to: 'none'
version: 0.1.0-dev.1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  desktop_drop: ^0.5.0
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  share_handler: ^0.0.25
  egg_core:
    path: ../packages/egg_core
  egg_ocr:
    path: ../packages/egg_ocr
  egg_data:
    path: ../packages/egg_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/benchmarks/
    - assets/benchmarks/synthetic/
