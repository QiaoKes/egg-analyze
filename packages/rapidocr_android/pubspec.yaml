name: rapidocr_android
description: Android RapidOCR integration for egg-analyze-v2.
publish_to: 'none'
version: 0.1.0-dev.1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  egg_core:
    path: ../egg_core
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: top.aoe.rapidocr_android
        pluginClass: RapidocrAndroidPlugin
